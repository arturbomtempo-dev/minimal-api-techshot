services:
  postgres:
    container_name: tunetrail-db
    image: postgres:17
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: tunetrail-db
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - tunetrail-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d tunetrail-db"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  tunetrail-network:
    driver: bridge

volumes:
  pg-data:
